# ros2_control controller_manager config for the gz_ros2_control bringup.
# Loaded by the gz_ros2_control system plugin (see ur5e_gz.urdf.xacro).
#
# NOTE: the trajectory controller is intentionally named
# 'scaled_joint_trajectory_controller' (the UR driver name) so ur_control's Arm
# drives the simulated robot unchanged. In sim there is no UR speed-scaling
# interface, so it is a plain joint_trajectory_controller (not the ur_controllers
# scaled variant), exposing the same FollowJointTrajectory action.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.6

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity
