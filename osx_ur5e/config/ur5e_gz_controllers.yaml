# ros2_control controller_manager config for the gz_ros2_control bringup.
# Loaded by the gz_ros2_control system plugin (see ur5e_gz.urdf.xacro).
#
# NOTE: the trajectory controller is intentionally named
# 'scaled_joint_trajectory_controller' (the UR driver name) so ur_control's Arm
# drives the simulated robot unchanged. In sim there is no UR speed-scaling
# interface, so it is a plain joint_trajectory_controller (not the ur_controllers
# scaled variant), exposing the same FollowJointTrajectory action.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # FZI Cartesian compliance controller (FDCC). Loaded inactive; ur_control's
    # CompliantController switches it on (it claims the same position command interfaces
    # as scaled_joint_trajectory_controller, so only one of the two runs at a time).
    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

force_torque_sensor_broadcaster:
  ros__parameters:
    # Backed by the gz force_torque sensor on wrist_3_joint (see the <sensor> blocks in
    # ur5e_gz.urdf.xacro), reported in the wrist_3_link frame. Publishes on ~/wrench; the
    # launch remaps that to /wrench so ur_control's Arm reads it unchanged
    # (FT_SUBSCRIBER='wrench'). sensor_name auto-derives the six standard interfaces.
    sensor_name: tcp_fts_sensor
    frame_id: wrist_3_link

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.6

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

cartesian_compliance_controller:
  ros__parameters:
    # KDL chain base_link -> tool0. Same links as config/hydra/controller/ur5e.yaml and the
    # real-robot config/ur5e_cartesian_controllers.yaml, so an FDCC policy transfers between
    # sim and hardware unchanged.
    robot_base_link: base_link
    end_effector_link: tool0
    compliance_ref_link: tool0
    # Frame the wrench on ft_sensor_wrench is expressed in. Unlike the real robot (tool0),
    # the gz sensor reports in wrist_3_link; the controller transforms it to
    # compliance_ref_link via TF. Must be a link in the arm chain.
    ft_sensor_ref_link: wrist_3_link
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position

    # Defaults mirror config/hydra/controller/ur5e.yaml; CompliantController overrides
    # stiffness / pd_gains / selection matrix at runtime via ~/set_parameters.
    stiffness:  # w.r.t. compliance_ref_link
      trans_x: 800.0
      trans_y: 800.0
      trans_z: 800.0
      rot_x: 20.0
      rot_y: 20.0
      rot_z: 20.0
    solver:
      error_scale: 0.9
      iterations: 1
    pd_gains:
      trans_x: {p: 0.05, d: 0.0}
      trans_y: {p: 0.05, d: 0.0}
      trans_z: {p: 0.05, d: 0.0}
      rot_x: {p: 0.1, d: 0.0}
      rot_y: {p: 0.1, d: 0.0}
      rot_z: {p: 0.1, d: 0.0}
