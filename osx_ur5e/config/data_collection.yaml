# ================== Dataset Configuration ==================
dataset:
  repo_id: test_dataset
  task: "Pick and place the object"
  root: /root/osx-ur/dependencies/comet/comet/data # null = lerobot default (~/.cache/huggingface/lerobot)
  fps: 20
  num_episodes: 50
  episode_time_s: 60.0
  reset_time_s: 10.0
  robot_type: ur5e

# ================== Camera Configuration ==================
# cameras:
#   front_camera:
#     height: 480
#     width: 640
#     channels: 3
#   wrist_camera:
#     height: 480
#     width: 640
#     channels: 3

# ================== Observation (state) features ==================
# key: feature name used in the dataset
# value: list of ints representing the shape
states:
  observation.eef_position: [3]
  observation.eef_rotation_ortho6: [6]
  observation.eef_rotation_axis_angle: [3]
  observation.eef_wrench: [6]

# ================== Action features ==================
actions:
  action.joint_angles: [6]
  action.position: [3]
  action.rotation_ortho6: [6]
  action.rotation_axis_angle: [3]
  action.delta_position: [3]
  action.delta_rotation: [3]

# ================== Image Writer ==================
image_writer:
  num_processes: 0
  threads_per_camera: 4


# ================== Controller Configuration ==================
controller:
  mode: "spring-mass-damper" # "parallel"
  p_gains: [0.035, 0.035, 0.035, 0.5, 0.5, 0.5]
  d_gains: [0, 0, 0, 0, 0, 0]
  selection_matrix: [1, 1, 1, 1, 1, 1]
  error_scale: 0.8
  iterations: 1.0
  stiffness_limits:
    translation: [50, 1500]
    rotation: [10, 1000]
